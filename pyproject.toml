[project]
name = "lifelog"
version = "0.1.0"
description = "Personal life tracker (finance, gym, diet) with a Telegram interface"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot>=21.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.scripts]
lifelog = "tracker.bot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tracker"]
